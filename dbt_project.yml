name: velov
version: 1.0.0
config-version: 2

profile: velov

model-paths: ["dbt/models"]
seed-paths: ["dbt/seeds"]
test-paths: ["dbt/tests"]

seeds:
  velov:
    +schema: bronze
    bronze_velov:
      +column_types:
        station_id: integer
        timestamp: timestamptz
        capacity: integer
        bikes_available: integer
        temperature: double
        is_raining: boolean

models:
  velov:
    silver:
      +schema: silver
    gold:
      +schema: gold
