services:
  api:
    build: .
    ports:
      - "8000:8000"

    environment:
      MODEL_DIR: /app/models
      DATABASE_URL: >-
        postgresql+psycopg://velov:${POSTGRES_PASSWORD:?}@db:5432/velov

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: velov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: velov

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velov -d velov"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  pgdata: